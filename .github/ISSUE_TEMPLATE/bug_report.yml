name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post private keys, `.ovpn` files, link tokens or real passwords.** For a security problem, use the [private report](https://github.com/MohZeh/darban-ovpn/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sudo darban version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was the server set up?
      options:
        - By this tool (server-setup)
        - It already had OpenVPN
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: "`sudo darban status` and the relevant error. Remove addresses you do not want public."
      render: text
