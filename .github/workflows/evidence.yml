name: Evidence
# Runtime evidence for the v1.0.0 design: records how the real Ubuntu, OpenVPN, systemd and certbot behave.
# Test-only; it changes no product code and passes or fails nothing about the product. Started by hand, or by
# a push to its own branch.
on:
  push:
    branches: [test/runtime-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Evidence (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            runner: ubuntu-24.04
          - ubuntu: '26.04'
            runner: ubuntu-26.04
          - ubuntu: '24.04'
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
      - name: Collect the evidence
        env:
          EVIDENCE_OUT: ${{ runner.temp }}/evidence.md
        run: sudo --preserve-env=EVIDENCE_OUT bash tests/evidence-ci.sh --i-know
      - name: Write the evidence to the summary
        if: always()
        env:
          EVIDENCE_OUT: ${{ runner.temp }}/evidence.md
        run: if [ -s "$EVIDENCE_OUT" ]; then cat "$EVIDENCE_OUT" >> "$GITHUB_STEP_SUMMARY"; fi
