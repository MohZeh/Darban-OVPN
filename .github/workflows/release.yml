name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  # Before any slow test: a tag that cannot become a release stops here.
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: The tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # darban-core is built with the toolchain go.mod pins, so both builds of the tag give the same bytes.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The version, changelog and archive must be ready
        id: build
        run: |
          bash scripts/build-release.sh "$RUNNER_TEMP/release"
          echo "sums=$(sha256sum < "$RUNNER_TEMP/release/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml
    # What its Lint job asks for. On a tag it does not use them: a release always runs every test.
    permissions:
      contents: read
      actions: read
      pull-requests: read

  # Every release starts as a pre-release, so "latest" and the update notice never see an unchecked one.
  publish:
    name: Publish as a pre-release
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token and attestations: the provenance of the files, which anyone can check with gh attestation verify.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # darban-core is built with the toolchain go.mod pins, so both builds of the tag give the same bytes.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build assets
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      # The files published are the ones the check built, byte for byte: the archive carries the commit's time.
      - name: The same files as the check built
        env:
          CHECKED: ${{ needs.check.outputs.sums }}
        run: test "$(sha256sum < "$RUNNER_TEMP/release/SHA256SUMS" | cut -d' ' -f1)" = "$CHECKED"
      # Signed build provenance: this workflow, at this commit, made these files. get.sh still checks SHA256SUMS.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/darban-ovpn.tar.gz
            ${{ runner.temp }}/release/darban-ovpn-amd64.tar.gz
            ${{ runner.temp }}/release/darban-ovpn-arm64.tar.gz
            ${{ runner.temp }}/release/get.sh
            ${{ runner.temp }}/release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --verify-tag --prerelease --latest=false \
            --title "Darban OVPN $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release/RELEASE-NOTES.txt"

  verify:
    name: Verify the published files
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

  # The command users are told to run, from the published files. Downloads need a public repository.
  smoke:
    name: Install with the one-line command (Ubuntu ${{ matrix.ubuntu }})
    needs: verify
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, update from the release before it, and run again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          earlier=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName --jq '.[].tagName' | grep -vxF "$GITHUB_REF_NAME" | sort -V | tail -n 1 || true)
          # With no earlier release, no argument at all.
          bash tests/release-smoke.sh --i-know "$GITHUB_REF_NAME" ${earlier:+"$earlier"}

  # A tag with a suffix, such as -rc.1, stays a pre-release and is never offered as an update. A stable one
  # becomes latest only after the one-line command installed it, so a private repository never promotes.
  promote:
    name: Mark as the latest release
    needs: [verify, smoke]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.smoke.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Mark as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
