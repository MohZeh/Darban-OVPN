name: CI
on:
  push:
    branches: [main]
  # A draft runs Lint only. The slow tests start when it is marked ready, so pull requests waiting in line are not
  # tested against a main that the next merge changes anyway. Converting one to a draft cancels its run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Weekly: OpenVPN's repository and Ubuntu's kernels change without any commit here.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      vm_only:
        description: Only the reboot and arm64 tests, for a commit whose pull request runs the others
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always runs, and decides whether the slower jobs are needed.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read-only, to find the pull request of a push to main and whether its CI passed.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # The slow tests are skipped for documentation only, for a push to main whose exact files its pull request
      # already tested green, for a manual run that asks for the reboot and arm64 tests only, and for a draft.
      code: ${{ (steps.tested.outputs.tested == 'true' || inputs.vm_only || github.event.pull_request.draft) && 'false' || steps.scope.outputs.code }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tree names the exact files, so a result can be matched to the code it tested after a squash or merge.
      - name: The commit and the files it holds
        id: source
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Commit $(git rev-parse HEAD), tree $tree" >> "$GITHUB_STEP_SUMMARY"
      - name: Only the reboot and arm64 tests
        if: inputs.vm_only
        run: echo 'This manual run asked for the reboot and arm64 tests only. The other tests are not run here on purpose; the pull request runs them.' >> "$GITHUB_STEP_SUMMARY"
      - name: Decide which tests this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"
      - name: Did the pull request already test these exact files?
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          bash scripts/ci-already-tested.sh | tee -a "$GITHUB_OUTPUT"
          if grep -qx 'tested=true' "$GITHUB_OUTPUT"; then
            echo 'The pull request of this commit already tested these exact files, and passed: the slow tests are not run again.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ShellCheck, Python syntax, file modes and documentation
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          bash scripts/lint.sh
      # Tests that still expect text the code no longer has: the text removed on this branch, compared with the
      # commit it starts from. With nothing to compare with, only the scripted terminal answers are checked.
      - name: Tests expect only text the code has
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-stale-strings.py "$BASE"
      - name: Workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -color
      - name: Release assets build
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"

  test:
    # Each Ubuntu version and each suite is its own job, so they run side by side and the slowest alone sets the
    # waiting time. One failing does not stop the others. A whole suite took 12 to 17 minutes, so each runs in
    # parts, every part on a runner of its own: about 4 to 5 minutes each, and together the whole suite.
    name: Test (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.suite }}${{ matrix.parts > 1 && format(', part {0} of {1}', matrix.part, matrix.parts) || '' }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stand-in adds only failure cases Easy-RSA cannot produce, so one Ubuntu version is enough.
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 1, parts: 3}
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 2, parts: 3}
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 3, parts: 3}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 1, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 2, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 3, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 4, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 1, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 2, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 3, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 4, parts: 4}
          - {ubuntu: '24.04', suite: real terminal, part: 1, parts: 1}
          - {ubuntu: '26.04', suite: real terminal, part: 1, parts: 1}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    # A part takes about 5 minutes. A slow runner has run every test about 1.8 times slower.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
          echo "Ubuntu $VERSION_ID, kernel $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Easy-RSA
        if: matrix.suite == 'real Easy-RSA'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y easy-rsa
      - name: Tests with the stand-in Easy-RSA
        if: matrix.suite == 'stand-in Easy-RSA'
        env:
          DARBAN_TEST_EVIDENCE: ${{ runner.temp }}/evidence
          DARBAN_TEST_PART: ${{ matrix.part }}/${{ matrix.parts }}
        run: bash tests/run-tests.sh </dev/null
      - name: Tests with the real Easy-RSA
        if: matrix.suite == 'real Easy-RSA'
        env:
          DARBAN_TEST_EVIDENCE: ${{ runner.temp }}/evidence
          DARBAN_TEST_PART: ${{ matrix.part }}/${{ matrix.parts }}
        run: DARBAN_REAL_EASYRSA=/usr/share/easy-rsa/easyrsa bash tests/run-tests.sh </dev/null
      - name: Real-terminal key tests
        if: matrix.suite == 'real terminal'
        run: python3 tests/run-tty-tests.py </dev/null
      # What a failed test left: its whole outputs, the fake server's logs, the listeners and processes of that
      # moment. The suite writes no key, certificate or profile there (scrub in run-tests.sh).
      - name: Keep the evidence of failed tests
        if: failure() && matrix.suite != 'real terminal'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.ubuntu }}-${{ matrix.suite }}-part-${{ matrix.part }}-of-${{ matrix.parts }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 7

  # Runs the real setup, OpenVPN, Easy-RSA, systemd and a real client on a throwaway runner.
  acceptance:
    name: Acceptance (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
          echo "Ubuntu $VERSION_ID, kernel $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup and client on Ubuntu ${{ matrix.ubuntu }}
        # sudo keeps no variable, so the summary file is named: what a green run did not test is written there.
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/acceptance-ci.sh --i-know

  # The setup on a public address: the path the acceptance run skips, because it uses 127.0.0.1.
  public-setup:
    name: Setup on a public address (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup on a public address, and its removal
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/public-setup-ci.sh --i-know

  rc10-upgrade:
    name: From rc.10 and back (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: rc.10 from its release, the update to this code, Restore previous version, and back
        run: sudo bash tests/rc10-upgrade-ci.sh --i-know

  # The backup of the CA with a real age key, and its restore: refused when it would undo a revocation or run a
  # program, and the way back from a lost server.
  restore:
    name: Backup and restore of the CA (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Backup, refused restores, and a restore on a new server
        run: sudo bash tests/restore-ci.sh --i-know

  # A real virtual machine, so a real reboot. Not on every push: it takes several minutes.
  reboot:
    name: Reboot test (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the virtual machine tools and a client
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openvpn
      - name: Set up, reboot and connect from outside
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        run: sudo bash tests/vm-reboot.sh --i-know "$UBUNTU"

  # arm64 runners are free only for public repositories. Not on every push: the code is the same.
  acceptance-arm:
    name: Acceptance (Ubuntu 24.04, arm64)
    needs: lint
    if: ${{ !github.event.repository.private && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup and client on arm64
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/acceptance-ci.sh --i-know

  # The one check a branch rule requires. Matrix job names cannot be required reliably when they are skipped.
  # A manual run for the reboot and arm64 tests only gets another name: it skips the other tests on purpose, so
  # it must never stand in for the CI result of the commit.
  result:
    name: ${{ inputs.vm_only && 'VM qualification result' || 'CI result' }}
    if: always()
    needs: [lint, test, acceptance, public-setup, rc10-upgrade, restore, acceptance-arm, reboot]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every needed job must have passed
        env:
          CODE: ${{ needs.lint.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          PUBLIC: ${{ needs.public-setup.result }}
          RC10: ${{ needs.rc10-upgrade.result }}
          RESTORE: ${{ needs.restore.result }}
          ARM: ${{ needs.acceptance-arm.result }}
          REBOOT: ${{ needs.reboot.result }}
          VM_ONLY: ${{ inputs.vm_only && 'true' || 'false' }}
          DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          TREE: ${{ needs.lint.outputs.tree }}
        run: |
          echo "Lint: $LINT, Test: $TEST, Acceptance: $ACCEPTANCE, public address: $PUBLIC, from rc.10: $RC10, restore: $RESTORE, arm64: $ARM, reboot: $REBOOT, code changed: $CODE, reboot and arm64 only: $VM_ONLY"
          echo "Tree $TREE" >> "$GITHUB_STEP_SUMMARY"
          test "$LINT" = success
          # A draft is never a pass: its slow tests did not run, and a skipped required check would count as passed.
          if [ "$DRAFT" = true ]; then
            echo 'Draft: the slow tests run when it is marked ready.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$VM_ONLY" = true ]; then
            # What this run was asked for must have run, not been skipped.
            test "$REBOOT" = success
            test "$ARM" = success
          fi
          test "$ARM" = success || test "$ARM" = skipped
          test "$REBOOT" = success || test "$REBOOT" = skipped
          if [ "$CODE" = true ]; then
            test "$TEST" = success
            test "$ACCEPTANCE" = success
            test "$PUBLIC" = success
            test "$RC10" = success
            test "$RESTORE" = success
          else
            test "$TEST" = skipped
            test "$ACCEPTANCE" = skipped
            test "$PUBLIC" = skipped
            test "$RC10" = skipped
            test "$RESTORE" = skipped
          fi
