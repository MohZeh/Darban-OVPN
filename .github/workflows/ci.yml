name: CI
on:
  push:
    branches: [main]
  # A draft runs Lint and the unit tests, so a wrong test shows up before it is marked ready. The slow tests start
  # when it is marked ready, so pull requests waiting in line are not tested against a main that the next merge
  # changes anyway. Converting one to a draft cancels its run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Weekly: OpenVPN's repository and Ubuntu's kernels change without any commit here.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      vm_only:
        description: Only the reboot and arm64 tests, for a commit whose pull request runs the others
        type: boolean
        default: false
      scale:
        description: Only the scale measurements, for a commit whose pull request runs the other tests
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always runs, and decides whether the slower jobs are needed.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # Building staticcheck and govulncheck takes a minute or two.
    timeout-minutes: 10
    # Read-only, to find the pull request of a push to main and whether its CI passed.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # The slow tests are skipped for documentation only, for a push to main whose exact files its pull request
      # already tested green, for a manual run that asks for the reboot and arm64 tests or the scale measurements
      # only. The unit tests run on a draft too.
      code: ${{ (steps.tested.outputs.tested == 'true' || inputs.vm_only || inputs.scale) && 'false' || steps.scope.outputs.code }}
      # The slow jobs: the same, but never for a draft.
      slow: ${{ (steps.tested.outputs.tested == 'true' || inputs.vm_only || inputs.scale || github.event.pull_request.draft) && 'false' || steps.scope.outputs.code }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tree names the exact files, so a result can be matched to the code it tested after a squash or merge.
      - name: The commit and the files it holds
        id: source
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Commit $(git rev-parse HEAD), tree $tree" >> "$GITHUB_STEP_SUMMARY"
      - name: Only the reboot and arm64 tests
        if: inputs.vm_only
        run: echo 'This manual run asked for the reboot and arm64 tests only. The other tests are not run here on purpose; the pull request runs them.' >> "$GITHUB_STEP_SUMMARY"
      - name: Only the scale measurements
        if: inputs.scale && !inputs.vm_only
        run: echo 'This manual run asked for the scale measurements only. The other tests are not run here on purpose; the pull request runs them.' >> "$GITHUB_STEP_SUMMARY"
      - name: Decide which tests this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"
      - name: Did the pull request already test these exact files?
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          bash scripts/ci-already-tested.sh | tee -a "$GITHUB_OUTPUT"
          if grep -qx 'tested=true' "$GITHUB_OUTPUT"; then
            echo 'The pull request of this commit already tested these exact files, and passed: the slow tests are not run again.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # darban-core uses the standard library only, so there is no go.sum and no module but its own. The tools are
      # for CI only, each at a pinned version.
      # The Go steps run when a Go file, go.mod or this workflow changed, and always weekly and by hand. The build cache
      # and the two pinned tools are kept between runs, keyed on the Go version and the tool versions.
      - name: Cache the Go build and the tools
        if: steps.scope.outputs.go == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ hashFiles('go.mod', '.github/workflows/ci.yml') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ hashFiles('go.mod', '.github/workflows/ci.yml') }}-
      - name: 'Go: gofmt, go vet, staticcheck, govulncheck, the standard library only'
        if: steps.scope.outputs.go == 'true'
        env:
          STATICCHECK: v0.8.2
          GOVULNCHECK: v1.9.0
          VULN: ${{ steps.scope.outputs.vuln }}
        run: |
          test ! -e go.sum
          test "$(go list -m all)" = github.com/MohZeh/Darban-OVPN
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not formatted with gofmt: $unformatted"; exit 1; fi
          go vet ./...
          bin=$(go env GOPATH)/bin
          if [ ! -x "$bin/staticcheck" ]; then go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK"; fi
          "$bin/staticcheck" ./...
          # The standard library and the tool change without any commit here, so the weekly run, a manual run, and a
          # change of go.mod or this workflow check them; an ordinary change does not.
          if [ "$VULN" = true ]; then
            if [ ! -x "$bin/govulncheck" ]; then go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK"; fi
            "$bin/govulncheck" ./...
          fi
      # In Lint, so a draft sees them: about half a minute. The race detector needs cgo; the release build has none.
      - name: 'Go: go test -race'
        if: steps.scope.outputs.go == 'true'
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...
      # The suite's runner, which lint.sh starts once, builds a fake server with it.
      - name: Build darban-core
        run: bash scripts/build-core.sh
      - name: ShellCheck, Python syntax, file modes and documentation
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          bash scripts/lint.sh
      # Tests that still expect text the code no longer has: the text removed on this branch, compared with the
      # commit it starts from. With nothing to compare with, only the scripted terminal answers are checked.
      - name: Tests expect only text the code has
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-stale-strings.py "$BASE"
      # A refactor, by its title, moves code and keeps every function: the set is compared with the base.
      - name: A refactor keeps the same functions
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
        run: python3 scripts/check-modules.py "$BASE"
      - name: Workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -color
      - name: Release assets build
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"

  test:
    # Each Ubuntu version and each suite is its own job, so they run side by side and the slowest alone sets the
    # waiting time. One failing does not stop the others. A whole suite took 12 to 17 minutes, so each runs in
    # parts, every part on a runner of its own: about 4 to 5 minutes each, and together the whole suite.
    name: Test (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.suite }}${{ matrix.parts > 1 && format(', part {0} of {1}', matrix.part, matrix.parts) || '' }})
    needs: lint
    if: needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stand-in adds only failure cases Easy-RSA cannot produce, so one Ubuntu version is enough.
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 1, parts: 3}
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 2, parts: 3}
          - {ubuntu: '24.04', suite: stand-in Easy-RSA, part: 3, parts: 3}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 1, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 2, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 3, parts: 4}
          - {ubuntu: '24.04', suite: real Easy-RSA, part: 4, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 1, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 2, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 3, parts: 4}
          - {ubuntu: '26.04', suite: real Easy-RSA, part: 4, parts: 4}
        # The real-terminal tests take under a minute, so they run in the short checks job below.
    runs-on: ubuntu-${{ matrix.ubuntu }}
    # A part takes about 5 minutes. A slow runner has run every test about 1.8 times slower.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
          echo "Ubuntu $VERSION_ID, kernel $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Easy-RSA
        if: matrix.suite == 'real Easy-RSA'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y easy-rsa
      - name: Tests with the stand-in Easy-RSA
        if: matrix.suite == 'stand-in Easy-RSA'
        env:
          DARBAN_TEST_EVIDENCE: ${{ runner.temp }}/evidence
          DARBAN_TEST_PART: ${{ matrix.part }}/${{ matrix.parts }}
        run: bash tests/run-tests.sh </dev/null
      - name: Tests with the real Easy-RSA
        if: matrix.suite == 'real Easy-RSA'
        env:
          DARBAN_TEST_EVIDENCE: ${{ runner.temp }}/evidence
          DARBAN_TEST_PART: ${{ matrix.part }}/${{ matrix.parts }}
        run: DARBAN_REAL_EASYRSA=/usr/share/easy-rsa/easyrsa bash tests/run-tests.sh </dev/null
      # What a failed test left: its whole outputs, the fake server's logs, the listeners and processes of that
      # moment. The suite writes no key, certificate or profile there (scrub in run-tests.sh).
      - name: Keep the evidence of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.ubuntu }}-${{ matrix.suite }}-part-${{ matrix.part }}-of-${{ matrix.parts }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 7

  # Runs the real setup, OpenVPN, Easy-RSA, systemd and a real client on a throwaway runner. After the install and
  # the first client, its checks come in two parts, each on a runner of its own, so neither waits for the other.
  acceptance:
    name: Acceptance (Ubuntu ${{ matrix.ubuntu }}, part ${{ matrix.part }})
    needs: lint
    if: needs.lint.outputs.slow == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        # 1: revocation, the CRL, the ends of sessions, the connection events and UDP, TCP or both with port-share.
        # 2: the settings, the network, links and files, certbot, the update and the removal.
        part: [1, 2]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
          echo "Ubuntu $VERSION_ID, kernel $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup and client on Ubuntu ${{ matrix.ubuntu }}, part ${{ matrix.part }}
        # sudo keeps no variable, so the summary file is named: what a green run did not test is written there.
        env:
          PART: all
          # The measurements only record numbers and fail nothing, so an ordinary pull request does not run them.
          MEASURE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale')) && '1' || '0' }}
        run: sudo MEASURE="$MEASURE" GO="$(command -v go)" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/acceptance-ci.sh --i-know "$PART"

  # Three checks of about a minute each, on one runner, so a run waits less for runners: the real-terminal tests,
  # which change nothing on the machine, then the setup on a public address, the path the acceptance run skips
  # because it uses 127.0.0.1, which ends with Remove everything; then, on the machine it left, the way from rc.10
  # and back. That that machine has no PKI or server left is checked first, so it is a clean start for rc.10 too.
  short:
    name: Terminal, public address and rc.10 (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.slow == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh
      - name: Real-terminal key tests
        run: python3 tests/run-tty-tests.py </dev/null
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup on a public address, and its removal
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/public-setup-ci.sh --i-know
      - name: Remove everything left no PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: rc.10 from its release, the update to this code, Restore previous version, and back
        run: sudo bash tests/rc10-upgrade-ci.sh --i-know
      # On the machine rc.10 left: acme.sh without snap, against Pebble, then Remove everything. A pull request runs it
      # on 24.04 only; weekly, by hand, or with the label scale, on both.
      - name: acme.sh without snap, Pebble, and Remove everything
        if: matrix.ubuntu == '24.04' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale')
        run: sudo bash tests/acme-short-ci.sh --i-know

  # The backup of the CA with a real age key, and its restore: refused when it would undo a revocation or run a
  # program, and the way back from a lost server.
  restore:
    name: Backup and restore of the CA (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    if: needs.lint.outputs.slow == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Backup, refused restores, and a restore on a new server
        run: sudo bash tests/restore-ci.sh --i-know

  # How long the everyday commands take with many clients: the real setup, then the real CA filled to 10,000 rows,
  # with 253 valid clients (a full /24 VPN network) or 1000. The times go to the summary and to an artifact, so a
  # later change is judged by numbers. Nothing here fails on a slow time; a command that fails does. The measurements
  # come in three parts, run one after the other on one runner after one setup and one set of data: the list and the
  # diagnostics, the CRL with the connection events, and last the menu and a new client. A job takes about 5 to 8 minutes, so not on
  # every pull request: only one labelled scale, the weekly run of main, and a manual run with scale. A label added
  # later counts from the next push. For a pull request, the same job also runs the manager of its base commit on the
  # same runner and data, in turn with its own, since runners differ by up to about 40% between jobs: the job fails
  # when a command of the change is more than 10% slower than the base. Both numbers and the ratio go to the summary.
  scale:
    name: Scale (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.clients }} clients)
    needs: lint
    if: inputs.scale || (needs.lint.outputs.slow == 'true' && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scale')))
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        clients: [253, 1000]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    # The comparison with the base runs each command up to six times more.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh
      # bin/ and lib/ of the base commit, which tests/scale-ci.sh stages beside the change to compare them.
      - name: The manager of the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE" bin lib | tar -x -C "$RUNNER_TEMP/base"
          test -f "$RUNNER_TEMP/base/bin/darban"
      # A mirror that is down or slow must not decide a test: the fastest one goes first.
      - name: Fastest apt mirror first
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-apt-mirrors.sh
      - name: Confirm the Ubuntu version
        env:
          EXPECTED: ${{ matrix.ubuntu }}
        run: |
          . /etc/os-release
          test "$VERSION_ID" = "$EXPECTED"
          echo "Ubuntu $VERSION_ID, kernel $(uname -r), $(nproc) CPUs" >> "$GITHUB_STEP_SUMMARY"
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup, ${{ matrix.clients }} clients, and the times of all three parts
        env:
          CLIENTS: ${{ matrix.clients }}
          PART: all
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=''
          if [[ -n $BASE_SHA ]]; then base=$RUNNER_TEMP/base; fi
          sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" BASE_TREE="$base" BASE_SHA="$BASE_SHA" bash tests/scale-ci.sh --i-know "$CLIENTS" "$PART" "$RUNNER_TEMP/scale"
      - name: Keep the times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-${{ matrix.ubuntu }}-${{ matrix.clients }}-clients
          path: |
            ${{ runner.temp }}/scale/scale.tsv
            ${{ runner.temp }}/scale/compare.tsv
          if-no-files-found: ignore
          retention-days: 90

  # A real virtual machine, so a real reboot. Not on every push: it takes several minutes.
  reboot:
    name: Reboot test (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    # A manual run for the scale measurements only skips it.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.vm_only || !inputs.scale)) || github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The virtual machine is amd64, as the runner.
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh amd64
      - name: Install the virtual machine tools and a client
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openvpn
      - name: Set up, reboot and connect from outside
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        run: sudo GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/vm-reboot.sh --i-know "$UBUNTU"

  # arm64 runners are free only for public repositories. Not on every push: the code is the same.
  acceptance-arm:
    name: Acceptance (Ubuntu 24.04, arm64)
    needs: lint
    if: ${{ !github.event.repository.private && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.vm_only || !inputs.scale)) || github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built on this arm64 runner, so the test installs and runs the arm64 binary.
      # The toolchain go.mod pins, for darban-core. No module cache: it has no dependency.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build darban-core
        run: bash scripts/build-core.sh arm64
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup and client on arm64
        run: sudo GO="$(command -v go)" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash tests/acceptance-ci.sh --i-know

  # The one check a branch rule requires. Matrix job names cannot be required reliably when they are skipped.
  # A manual run for the reboot and arm64 tests, or for the scale measurements, only gets another name: it skips
  # the other tests on purpose, so it must never stand in for the CI result of the commit.
  result:
    # A draft gets another name too, so the required "CI result" does not exist on it: it cannot merge, and a check
    # that is not red wakes nothing. The name comes from the event's own payload, so a re-run of an old draft run
    # stays a draft result, and a ready pull request, whose run starts at ready_for_review, always gets "CI result".
    name: "${{ inputs.vm_only && 'VM qualification result' || inputs.scale && 'Scale measurement result' || github.event.pull_request.draft && 'Draft result: Lint and unit tests' || 'CI result' }}"
    if: always()
    needs: [lint, test, acceptance, short, restore, scale, acceptance-arm, reboot]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every needed job must have passed
        env:
          CODE: ${{ needs.lint.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          SHORT: ${{ needs.short.result }}
          RESTORE: ${{ needs.restore.result }}
          SCALE: ${{ needs.scale.result }}
          ARM: ${{ needs.acceptance-arm.result }}
          REBOOT: ${{ needs.reboot.result }}
          VM_ONLY: ${{ inputs.vm_only && 'true' || 'false' }}
          SCALE_ONLY: ${{ inputs.scale && 'true' || 'false' }}
          DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          TREE: ${{ needs.lint.outputs.tree }}
        run: |
          echo "Lint: $LINT, Test: $TEST, Acceptance: $ACCEPTANCE, terminal, public address and rc.10: $SHORT, restore: $RESTORE, scale: $SCALE, arm64: $ARM, reboot: $REBOOT, code changed: $CODE, reboot and arm64 only: $VM_ONLY, scale only: $SCALE_ONLY"
          echo "Tree $TREE" >> "$GITHUB_STEP_SUMMARY"
          test "$LINT" = success
          # A draft is named "Draft result: Lint and unit tests", which no rule requires, so it can pass here: it is
          # never "CI result". It needs the unit tests green, or skipped when the change needs none.
          if [ "$DRAFT" = true ]; then
            if [ "$CODE" = true ]; then test "$TEST" = success; else test "$TEST" = skipped; fi
            test "$ACCEPTANCE" = skipped
            test "$SHORT" = skipped
            test "$RESTORE" = skipped
            echo 'Draft: Lint and the unit tests ran. The slow tests run when it is marked ready.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$VM_ONLY" = true ]; then
            # What this run was asked for must have run, not been skipped.
            test "$REBOOT" = success
            test "$ARM" = success
          fi
          if [ "$SCALE_ONLY" = true ]; then
            test "$SCALE" = success
          fi
          # Scale runs only when asked for: with the label scale, weekly, or by hand.
          test "$SCALE" = success || test "$SCALE" = skipped
          test "$ARM" = success || test "$ARM" = skipped
          test "$REBOOT" = success || test "$REBOOT" = skipped
          if [ "$CODE" = true ]; then
            test "$TEST" = success
            test "$ACCEPTANCE" = success
            test "$SHORT" = success
            test "$RESTORE" = success
          else
            test "$TEST" = skipped
            test "$ACCEPTANCE" = skipped
            test "$SHORT" = skipped
            test "$RESTORE" = skipped
          fi
