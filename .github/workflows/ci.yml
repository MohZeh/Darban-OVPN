name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck easy-rsa
      - name: Syntax
        run: for f in setup/*.sh bin/* lib/*.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=error setup/*.sh bin/* lib/*.sh scripts/*.sh tests/*.sh
      - name: Tests with the stand-in Easy-RSA
        run: bash tests/run-tests.sh </dev/null
      - name: Real-terminal key tests
        run: python3 tests/run-tty-tests.py </dev/null
      - name: Tests with the real Easy-RSA
        run: DARBAN_REAL_EASYRSA=/usr/share/easy-rsa/easyrsa bash tests/run-tests.sh </dev/null
      - name: Release assets build
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"

  # Runs the real setup, OpenVPN, Easy-RSA, systemd and a real client on a throwaway runner.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner must not already have a PKI or server
        run: sudo test ! -e /root/pki && test ! -e /etc/openvpn/server/server.conf
      - name: Real setup and client on Ubuntu 24.04
        run: sudo bash tests/acceptance-ci.sh --i-know
