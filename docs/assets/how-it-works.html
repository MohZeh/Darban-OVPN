<!doctype html>
<!-- Source of how-it-works-dark.png and how-it-works-light.png. Render: bash docs/assets/render.sh -->
<html lang="en"><head><meta charset="utf-8"><title>Darban OVPN architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
:root{--ink:#e9eef3;--soft:#98a5b2;--box:#161c24;--edge:#2f3945;--zone:rgba(255,255,255,.022);--zone-edge:#2d3641;
  --manage:#3ddc97;--share:#6ea8ff;--vpn:#ffa657;--manage-bg:rgba(61,220,151,.09);--share-bg:rgba(110,168,255,.10);--vpn-bg:rgba(255,166,87,.10)}
html.light{--ink:#16202b;--soft:#5a6875;--box:#ffffff;--edge:#d0d7de;--zone:rgba(9,30,66,.028);--zone-edge:#c9d1d9;
  --manage:#0a8f62;--share:#2563d8;--vpn:#c8660a;--manage-bg:rgba(10,143,98,.08);--share-bg:rgba(37,99,216,.08);--vpn-bg:rgba(200,102,10,.09)}
html,body{margin:0;width:1400px;height:750px;overflow:hidden;background:transparent}
svg{display:block;font-family:Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.node{fill:var(--box);stroke:var(--edge);stroke-width:1.5}
.tint{stroke-width:2}
.tm{stroke:var(--manage)}.th{stroke:var(--share)}.tv{stroke:var(--vpn)}
.bm{fill:var(--manage-bg)}.bh{fill:var(--share-bg)}.bv{fill:var(--vpn-bg)}
.zone{fill:var(--zone);stroke:var(--zone-edge);stroke-width:1.5;stroke-dasharray:7 7}
.zt{fill:var(--soft);font-size:16.5px;font-weight:600;letter-spacing:.1em}
.t{fill:var(--ink);font-size:23px;font-weight:600;text-anchor:middle;letter-spacing:-.012em}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-weight:500;font-size:21px;letter-spacing:0}
.big{font-weight:700;font-size:28px}
.s{fill:var(--soft);font-size:16.5px;text-anchor:middle}
.lab{font-size:17px;font-weight:600;text-anchor:middle}
.start{text-anchor:start}
.pill{font-size:16.5px;font-weight:600;text-anchor:middle}
.line{fill:none;stroke-width:2.5;stroke-linejoin:round}
.m{stroke:var(--manage)}.h{stroke:var(--share)}.v{stroke:var(--vpn)}
.mf{fill:var(--manage)}.hf{fill:var(--share)}.vf{fill:var(--vpn)}
.leg{fill:var(--soft);font-size:16.5px;font-weight:500}
</style>
<script>if(location.hash==='#light')document.documentElement.classList.add('light')</script>
</head><body>
